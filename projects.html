<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaxson Jennings | Projects</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-lightning-charge-fill"></i> Jaxson Jennings</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="experience.html">Experience</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode"><i class="bi bi-moon-stars-fill"></i></button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== Page Header ===== -->
  <header class="page-header">
    <div class="container">
      <h1>Projects</h1>
      <p class="mb-0">Class assignments, energy projects, and things I'm building on my own. Click a card for more details.</p>
    </div>
  </header>

  <section class="section">
    <div class="container">

      <!-- Filter buttons + search -->
      <div class="row align-items-center mb-4 g-3">
        <div class="col-lg-8">
          <button class="filter-btn active" data-category="All">All</button>
          <button class="filter-btn" data-category="Energy">Energy</button>
          <button class="filter-btn" data-category="Web">Web</button>
          <button class="filter-btn" data-category="Programming">Programming</button>
          <button class="filter-btn" data-category="Data">Data</button>
        </div>
        <div class="col-lg-4">
          <input type="text" id="projectSearch" class="form-control search-box" placeholder="Search by keyword (ex: Python)">
        </div>
      </div>

      <p id="projectCount" class="text-muted-custom small"></p>

      <!-- JavaScript fills this in using data/projects.json -->
      <div class="row g-4" id="project-grid">
        <div class="col-12 text-center py-5">
          <div class="spinner-border" style="color: var(--crimson);" role="status"></div>
          <p class="mt-2 text-muted-custom">Loading projects...</p>
        </div>
      </div>

    </div>
  </section>

  <!-- ===== Project Details Modal (filled in by JavaScript) ===== -->
  <div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <span class="category-label" id="modalCategory" style="color: var(--crimson); font-weight: 700; text-transform: uppercase; font-size: 0.75rem;"></span>
            <h4 class="modal-title" id="modalTitle"></h4>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="modalDetails"></p>
          <h6>Technologies</h6>
          <div id="modalTech" class="mb-3"></div>
          <div id="modalLink"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Footer ===== -->
  <footer class="footer text-center">
    <div class="container">
      <div class="mb-2">
        <a href="https://www.linkedin.com/in/jaxson-jennings-jax2027" target="_blank" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a>
        <a href="https://github.com/jaxsonjennings" target="_blank" aria-label="GitHub"><i class="bi bi-github"></i></a>
        <a href="contact.html" aria-label="Contact"><i class="bi bi-envelope-fill"></i></a>
      </div>
      <p class="mb-0">&copy; <span id="year">2026</span> Jaxson Jennings &middot; Built with HTML, CSS, JS &amp; Bootstrap</p>
    </div>
  </footer>

  <button id="backToTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
